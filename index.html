  <div style="background:#1a1d2e; border:2px solid #4cc9f0; padding:24px; border-radius:10px; width:360px; text-align:center;">
    <h3 style="margin:0 0 12px 0; color:#4cc9f0;">📢 COMMERCIAL BREAK</h3>
    <div id="autoAdSlot" style="width:300px; height:250px; margin:0 auto 14px auto; background:#0d0e14; display:flex; align-items:center; justify-content:center; overflow:hidden;">
      <div data-banner-id="2031958"></div>
    </div>
    <button id="autoAdCloseBtn" disabled style="padding:10px 20px; font-size:14px; background:#414868; color:#aaa; border:none; border-radius:6px;">Close in 5 sec...</button>
  </div>
</div>

<script>
// Запуск рекламы каждые 2 минуты (120 000 мс)
setInterval(() => {
  // Не показываем, если уже открыта другая реклама, меню паузы или экран проигрыша
  if (st !== 'play') return;
  if (document.getElementById('adModal')?.style.display === 'flex') return;

  // Сбрасываем клавиши и ставим игру на паузу
  k.KeyA = 0; k.KeyD = 0; k.ArrowLeft = 0; k.ArrowRight = 0; k.Space = 0;
  st = 'pause';

  const modal = document.getElementById('autoAdModal');
  const btn = document.getElementById('autoAdCloseBtn');
  modal.style.display = 'flex';

  let sec = 5;
  btn.disabled = true;
  btn.style.background = '#414868';
  btn.style.color = '#aaa';
  btn.innerText = `Закрыть через ${sec} сек...`;

  const timer = setInterval(() => {
    sec--;
    if (sec > 0) {
      btn.innerText = `Закрыть через ${sec} сек...`;
    } else {
      clearInterval(timer);
      btn.disabled = false;
      btn.style.background = '#3a86ff';
      btn.style.color = '#fff';
      btn.innerText = 'Продолжить игру ✖';
      btn.onclick = () => {
        modal.style.display = 'none';
        if (st === 'pause') st = 'play';
      };
    }
  }, 1000);
}, 20000);
</script>

function applyLang() {
  const isEn = (window._lang === 'en');
  document.querySelectorAll('button, div, span, h2, h3, option').forEach(el => {
    if (el.children.length === 0 && el.innerText) {
      const txt = el.innerText.trim();
      if (isEn && DICT[txt]) {
        el.dataset.ru = txt;
        el.innerText = DICT[txt];
      } else if (!isEn && el.dataset.ru) {
        el.innerText = el.dataset.ru;
      }
    }
  });
  const lBtn = document.getElementById('langBtn');
  if (lBtn) lBtn.innerText = isEn ? '🌐 Language: EN' : '🌐 Язык: RU';
}

function toggleLang() {
  window._lang = (window._lang === 'ru') ? 'en' : 'ru';
  localStorage.setItem('kn_lang', window._lang);
  applyLang();
}

const bBar = document.querySelector('.bar');
if (bBar && !document.getElementById('langBtn')) {
  const lb = document.createElement('button');
  lb.id = 'langBtn';
  lb.innerText = window._lang === 'en' ? '🌐 Language: EN' : '🌐 Язык: RU';
  lb.onclick = toggleLang;
  bBar.appendChild(lb);
}

const _origFillText = CanvasRenderingContext2D.prototype.fillText;
CanvasRenderingContext2D.prototype.fillText = function(text, x, y, maxW) {
  if (window._lang === 'en' && typeof text === 'string') {
    for (const [ru, en] of Object.entries(GAME_WORDS)) {
      if (text.includes(ru)) text = text.replaceAll(ru, en);
    }
  }
  return _origFillText.call(this, text, x, y, maxW);
};

// Перевод динамических надписей на кнопках рекламы
setInterval(() => {
  if (window._lang !== 'en') return;
  const b1 = document.getElementById('adCloseBtn');
  if (b1 && b1.innerText.includes('Подождите')) b1.innerText = b1.innerText.replace('Подождите', 'Wait').replace('сек...', 'sec...');
  if (b1 && b1.innerText.includes('Забрать')) b1.innerText = b1.innerText.replace('Забрать', 'Claim').replace('очков', 'pts');
  const b2 = document.getElementById('autoAdCloseBtn');
  if (b2 && b2.innerText.includes('Закрыть через')) b2.innerText = b2.innerText.replace('Закрыть через', 'Close in').replace('сек...', 'sec...');
  if (b2 && b2.innerText.includes('Продолжить игру')) b2.innerText = 'Resume game ✖';
}, 300);

if (!localStorage.getItem('kn_lang') && navigator.language && navigator.language.startsWith('ru')) {
  window._lang = 'ru';
}
setTimeout(applyLang, 150);

  <script>
// Принудительно подгружаем баннер MyBid при каждом открытии рекламного окна
function reloadMyBidAds() {
  const old = document.querySelector('script[src*="mbidadm.com"]');
  if (old) old.remove();
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://mbidadm.com' + Date.now();
  s.setAttribute('data-admpid', '472878');
  document.body.appendChild(s);
}

// Следим за открытием обоих рекламных окон
const adObs = new MutationObserver(() => {
  const m1 = document.getElementById('adModal');
  const m2 = document.getElementById('autoAdModal');
  if ((m1 && m1.style.display === 'flex') || (m2 && m2.style.display === 'flex')) {
    reloadMyBidAds();
  }
});
['adModal', 'autoAdModal'].forEach(id => {
  const el = document.getElementById(id);
  if (el) adObs.observe(el, { attributes: true, attributeFilter: ['style'] });
});
</script>
